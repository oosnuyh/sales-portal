<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영업 포털</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --bg: #F2F0EA;
    --surface: #FBFAF6;
    --surface-raised: #FFFFFF;
    --ink: #24221D;
    --ink-70: rgba(36,34,29,.7);
    --ink-55: rgba(36,34,29,.55);
    --ink-40: rgba(36,34,29,.4);
    --border: #E6E2D6;
    --border-strong: #D6D0BF;
    --accent: #B5472F;
    --accent-soft: #F2E2DC;
    --sidebar-bg: #FBFAF6;
    --nav-idle: #EFEBE0;
    --nav-active: #24221D;
    --pos: #C0503B;
    --pos-soft: #E7A79A;
    --neg: #3D6B96;
    --neg-soft: #9AB9D3;
    --good: #3E7A4E;
    --warn: #B4791E;
    --bad: #B3402C;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-card: 0 1px 2px rgba(36,34,29,.04), 0 1px 10px rgba(36,34,29,.03);
    --font: 'Pretendard Variable', 'Pretendard', 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font);
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 224px; background: var(--sidebar-bg); border-right: 1px solid var(--border);
    padding: 28px 16px; flex-shrink: 0;
  }
  .component-label {
    font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 16px;
    display: flex; align-items: center; gap: 6px; letter-spacing: .01em;
  }
  .nav-item {
    background: var(--nav-idle); border-radius: var(--radius-md); padding: 13px 14px; margin-bottom: 8px;
    font-size: 13.5px; font-weight: 500; color: var(--ink-70); text-align: center; cursor: pointer;
    transition: background .15s, color .15s, transform .1s;
  }
  .nav-item.active { background: var(--nav-active); color: #FFF; font-weight: 600; }
  .nav-item:not(.active):hover { background: var(--border-strong); color: var(--ink); }
  .nav-item:active { transform: scale(.98); }
  .main-content { flex: 1; padding: 32px 36px; max-width: 1500px; min-width: 0; }
  #pageTitle { font-family: var(--font); letter-spacing: -.01em; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 22px 24px; margin-bottom: 20px;
  }
  .card-title {
    font-size: 12.5px; color: #FFF; letter-spacing: .02em;
    margin: -22px -24px 16px; padding: 11px 18px; font-weight: 700;
    background: var(--ink); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    display: flex; align-items: center; gap: 7px;
  }
  .card-title::before { content: '◆'; font-size: 10px; color: var(--pos-soft); }
  .kpiRow { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .kpiCard {
    flex: 1; min-width: 190px; border-radius: var(--radius-lg); padding: 18px 20px;
    color: #fff; box-shadow: var(--shadow-card);
  }
  .kpiCard .kpiLabel { font-size: 12px; opacity: .85; margin-bottom: 8px; font-weight: 500; }
  .kpiCard .kpiValue { font-size: 22px; font-weight: 800; font-family: var(--mono); letter-spacing: -.01em; }
  .kpiCard .kpiUnit { font-size: 11px; opacity: .75; margin-top: 4px; }
  table.dataTable { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.dataTable th, table.dataTable td { padding: 8px 10px; text-align: right; }
  table.dataTable th:first-child, table.dataTable td:first-child { text-align: left; }
  table.dataTable th { border-bottom: 1.5px solid var(--border-strong); color: var(--ink-70); font-weight: 700; font-size: 12px; }
  table.dataTable td { border-bottom: 1px solid var(--border); }
  table.dataTable tr:last-child td { border-bottom: none; }
  table.dataTable tr.totalRow { background: var(--accent-soft); font-weight: 700; }
  table.dataTable tr.totalRow td { border-bottom: none; }
  .pct-good { color: var(--good); font-weight: 700; }
  .pct-warn { color: var(--warn); font-weight: 700; }
  .pct-bad { color: var(--bad); font-weight: 700; }
  .range-inputs input {
    width: 60px; padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    font-family: var(--mono); font-size: 13px; text-align: center; background: var(--surface-raised); color: var(--ink);
  }
  .range-inputs input:focus, select:focus { outline: none; border-color: var(--accent); }
  .split-row { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 28px; }
  .split-row .card { flex: 1; margin-bottom: 0; min-width: 0; }
  .barSet { margin-bottom: 22px; }
  .barSet-label { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .barRow { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 0; }
  .barTrack { flex: 1; height: 22px; background: var(--border); border-radius: var(--radius-sm); position: relative; overflow: hidden; }
  .barFill { height: 100%; border-radius: var(--radius-sm); transition: width .25s ease; }
  .barFill.pos { background: var(--pos); }
  .barFill.neg { background: var(--neg); }
  .barValue { font-size: 12.5px; font-weight: 700; width: 110px; text-align: right; white-space: nowrap; font-family: var(--mono); }
  .quarterBars { display: none; margin: 10px 0 4px 0; padding: 12px 14px; background: var(--bg); border-radius: var(--radius-md); }
  .quarterBars.show { display: block; }
  .qBarRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
  .qBarLabel { width: 46px; font-size: 12px; color: var(--ink-55); }
  .qBarTrack { flex: 1; height: 16px; background: var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .qBarFill { height: 100%; }
  .qBarFill.pos { background: var(--pos-soft); }
  .qBarFill.neg { background: var(--neg-soft); }
  .qBarValue { font-size: 11.5px; width: 90px; text-align: right; font-family: var(--mono); }
  #detailArea .empty { color: var(--ink-40); font-size: 13px; }
  .detailQuarter { margin-bottom: 14px; }
  .detailQuarter .qTitle { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .detailQuarter .qItem { font-size: 12px; color: var(--ink-70); padding: 2px 0 2px 10px; }
  .detailQuarter .qItem .amt.pos { color: var(--good); font-weight: 600; }
  .detailQuarter .qItem .amt.neg { color: var(--bad); font-weight: 600; }
  select, button { font-family: var(--font); }

  /* ----- 반응형 (모바일) ----- */
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%; padding: 14px 16px; border-right: none; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; overflow-x: auto;
    }
    .component-label { margin-bottom: 0; flex-shrink: 0; }
    .nav-item {
      margin-bottom: 0; padding: 9px 14px; white-space: nowrap; flex-shrink: 0;
    }
    .main-content { padding: 18px 16px; max-width: 100%; }
    .split-row { flex-direction: column; gap: 16px; }
    .card { padding: 16px 14px; }
    .card-title { margin: -16px -14px 14px; }
    .kpiRow { flex-direction: column; gap: 10px; }
    .kpiCard { min-width: 0; }
    table.dataTable { font-size: 11.5px; }
    table.dataTable th, table.dataTable td { padding: 6px 6px; }
    .barValue { width: 88px; font-size: 11px; }
    #pageTitle { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="component-label">&#10070; Component</div>
    <div id="navList"></div>
  </div>
  <div class="main-content">
    <h2 id="pageTitle" style="font-size:18px;font-weight:600;margin:0 0 18px;"></h2>
    <div id="featureContent"></div>
  </div>
</div>

<script>
(function () {
  const FEATURES = [
    { id: 'main', label: '메인화면' },
    { id: 'top10', label: 'TOP10' },
    { id: 'schedule', label: '매출일정' },
    { id: 'rfp', label: '입찰공고', iframeUrl: 'https://oosnuyh.github.io/RPF/' },
    { id: 'ppt', label: 'PPT 폰트·컬러 정리', iframeUrl: './ppt-style-tool.html' },
  ];

  let DATA = null;

  function fmtWon(n) {
    const sign = n < 0 ? '-' : '';
    return sign + Math.round(Math.abs(n)).toLocaleString('en-US') + '원';
  }

  function pctClass(p) {
    if (p >= 100) return 'pct-good';
    if (p >= 90) return 'pct-warn';
    return 'pct-bad';
  }

  // ----- 사이드바 -----
  function renderNav() {
    const navList = document.getElementById('navList');
    navList.innerHTML = FEATURES.map((f, i) =>
      `<div class="nav-item ${i === 0 ? 'active' : ''}" data-id="${f.id}">${f.label}</div>`
    ).join('');
    navList.querySelectorAll('.nav-item').forEach((el) => {
      el.addEventListener('click', () => {
        navList.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        renderFeature(el.getAttribute('data-id'));
      });
    });
  }

  function renderFeature(id) {
    const feature = FEATURES.find(f => f.id === id) || FEATURES[0];
    document.getElementById('pageTitle').textContent = feature.label;
    if (feature.id === 'main') renderMainFeature();
    if (feature.id === 'top10') renderTop10Feature();
    if (feature.id === 'schedule') renderScheduleFeature();
    if (feature.iframeUrl) renderIframeFeature(feature.iframeUrl);
  }

  function renderIframeFeature(url) {
    const container = document.getElementById('featureContent');
    function buildUrl() {
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}_cb=${Date.now()}`;
    }
    container.innerHTML = `<div style="margin-bottom:10px;display:flex;justify-content:flex-end;">
      <button id="rfpRefreshBtn" style="font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid #D8D3C7;background:#fff;color:#5B5F6B;cursor:pointer;">새로고침</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <iframe id="rfpIframe" src="${buildUrl()}" style="width:100%;height:calc(100vh - 180px);border:none;display:block;"></iframe>
    </div>`;
    document.getElementById('rfpRefreshBtn').addEventListener('click', () => {
      document.getElementById('rfpIframe').src = buildUrl();
    });
  }

  // ----- 메인화면: 구간별 실적조회 + 변화량 그래프 -----
  function renderMainFeature() {
    const container = document.getElementById('featureContent');
    container.innerHTML = `
      <div id="kpiRow"></div>
      <div class="card" id="targetCard"></div>
      <div class="split-row">
        <div class="card" id="chartCard"><div class="card-title">구간별 변화량</div><div id="chartArea"></div></div>
        <div class="card" id="detailCard"><div class="card-title">변화 내용</div><div id="detailArea"><div class="empty">막대를 클릭하면 분기별 변화 내용이 여기 나와요.</div></div></div>
      </div>
      <div class="card" id="checklistCard"></div>
    `;
    renderKpiCards();
    renderTargetBox();
    renderCharts();
    renderChecklistBox();
  }

  // ----- 핵심 지표 (KPI) 카드 -----
  function renderKpiCards() {
    const row = document.getElementById('kpiRow');
    const tva = DATA && DATA.targetVsActual;
    if (!tva) { row.innerHTML = ''; return; }

    let revTarget = 0, revActual = 0, ordTarget = 0, ordActual = 0;
    for (const team of tva.teams) {
      revTarget += sumRange(tva.revenueTargets[team], 1, 12);
      revActual += sumRange(tva.revenueActuals[team], 1, 12);
      ordTarget += sumRange(tva.orderTargets[team], 1, 12);
      ordActual += sumRange(tva.orderActuals[team], 1, 12);
    }
    const revPct = revTarget ? (revActual / revTarget * 100) : 0;
    const ordPct = ordTarget ? (ordActual / ordTarget * 100) : 0;

    const cards = [
      { label: '26년 누적 매출 실적', value: fmtWon(revActual), bg: '#2E5FA3' },
      { label: '26년 누적 수주 실적', value: fmtWon(ordActual), bg: '#B5472F' },
      { label: '매출 달성률 (연간)', value: `${revPct.toFixed(1)}%`, bg: revPct >= 100 ? '#3E7A4E' : '#B4791E' },
      { label: '수주 달성률 (연간)', value: `${ordPct.toFixed(1)}%`, bg: ordPct >= 100 ? '#3E7A4E' : '#B4791E' },
    ];

    row.innerHTML = `<div class="kpiRow">${cards.map(c => `
      <div class="kpiCard" style="background:${c.bg};">
        <div class="kpiLabel">${c.label}</div>
        <div class="kpiValue">${c.value}</div>
      </div>`).join('')}</div>`;
  }

  // ----- 계약 만기 체크리스트 -----
  function renderChecklistBox() {
    const card = document.getElementById('checklistCard');
    const rc = DATA && DATA.renewalChecklist;
    if (!rc || !rc.monthGroups || !rc.monthGroups.some(g => g.solutionFlagged.length > 0 || g.maFlagged.length > 0)) {
      card.innerHTML = '<div class="card-title">계약 만기 체크리스트</div><div style="font-size:13px;color:#9A9689;">지금 확인해야 할 계약 만기 항목이 없어요.</div>';
      return;
    }
    function offsetLabel(offset) { return offset === 0 ? '이번달' : `${offset}개월 후`; }
    let html = '<div class="card-title">계약 만기 체크리스트</div>';
    for (const g of rc.monthGroups) {
      if (g.solutionFlagged.length === 0 && g.maFlagged.length === 0) continue;
      const urgent = g.offset === 0;
      const color = urgent ? '#C0392B' : '#B45309';
      html += `<div style="margin-bottom:14px;">
        <div style="font-size:13px;font-weight:700;color:${color};margin-bottom:6px;">${g.year2}년 ${g.month}월 (${offsetLabel(g.offset)}${urgent ? ' — 시급' : ''})</div>`;
      if (g.solutionFlagged.length > 0) {
        html += `<div style="font-size:12px;color:${color};font-weight:600;margin:4px 0 2px;">솔루션 매출 — 무상보증 종료 (유상전환 검토)</div>`;
        html += g.solutionFlagged.map(item => `<div style="font-size:12px;color:#3A3D45;padding:2px 0 2px 10px;">${item.name}${item.period ? ` <span style="color:#9A9689;">(${item.period})</span>` : ''}${item.contract ? ` — ${fmtWon(item.contract)}` : ''}</div>`).join('');
      }
      if (g.maFlagged.length > 0) {
        html += `<div style="font-size:12px;color:${color};font-weight:600;margin:6px 0 2px;">MA 매출 — 계약 갱신 검토</div>`;
        html += g.maFlagged.map(item => `<div style="font-size:12px;color:#3A3D45;padding:2px 0 2px 10px;">${item.name}${item.contract ? ` — ${fmtWon(item.contract)}` : ''}</div>`).join('');
      }
      html += `</div>`;
    }
    card.innerHTML = html;
  }

  // ----- 구간별 실적조회 박스 -----
  function renderTargetBox() {
    const card = document.getElementById('targetCard');
    if (!DATA || !DATA.targetVsActual) {
      card.innerHTML = '<div class="card-title">구간별 실적조회</div><div style="font-size:13px;color:#9A9689;">목표대비실적 데이터가 없어요 (입력 페이지에서 매출·수주 최신 파일을 올려서 다시 만들어주세요).</div>';
      return;
    }
    const tva = DATA.targetVsActual;
    card.innerHTML = `
      <div class="card-title">구간별 실적조회</div>
      <div class="range-inputs" style="margin-bottom:12px;">
        <label style="font-size:12px;color:#5B5F6B;margin-right:6px;">시작월</label>
        <input type="number" id="startMonth" min="1" max="12" value="1" />
        <label style="font-size:12px;color:#5B5F6B;margin:0 6px 0 14px;">종료월</label>
        <input type="number" id="endMonth" min="1" max="12" value="12" />
      </div>
      <table class="dataTable" id="targetTable"></table>
    `;
    document.getElementById('startMonth').addEventListener('input', renderTargetTable);
    document.getElementById('endMonth').addEventListener('input', renderTargetTable);
    renderTargetTable();
  }

  function sumRange(arr, start, end) {
    let s = 0;
    for (let m = start; m <= end; m++) s += arr[m - 1] || 0;
    return s;
  }

  function renderTargetTable() {
    const tva = DATA.targetVsActual;
    let start = Number(document.getElementById('startMonth').value) || 1;
    let end = Number(document.getElementById('endMonth').value) || 12;
    start = Math.max(1, Math.min(12, start));
    end = Math.max(1, Math.min(12, end));
    if (end < start) end = start;

    const rows = [{ label: '본부 전체', isTotal: true }].concat(tva.teams.map(t => ({ label: t, isTotal: false })));

    let html = `<tr>
      <th></th>
      <th>수주목표</th><th>수주실적</th><th>수주달성률</th><th>수주연목표대비</th>
      <th>매출목표</th><th>매출실적</th><th>매출달성률</th><th>매출연목표대비</th>
    </tr>`;

    let totalOrdTarget = 0, totalOrdActual = 0, totalOrdAnnualTarget = 0;
    let totalRevTarget = 0, totalRevActual = 0, totalRevAnnualTarget = 0;

    const teamRows = tva.teams.map((team) => {
      const ordTarget = sumRange(tva.orderTargets[team], start, end);
      const ordActual = sumRange(tva.orderActuals[team], start, end);
      const ordAnnualTarget = sumRange(tva.orderTargets[team], 1, 12);
      const revTarget = sumRange(tva.revenueTargets[team], start, end);
      const revActual = sumRange(tva.revenueActuals[team], start, end);
      const revAnnualTarget = sumRange(tva.revenueTargets[team], 1, 12);

      totalOrdTarget += ordTarget; totalOrdActual += ordActual; totalOrdAnnualTarget += ordAnnualTarget;
      totalRevTarget += revTarget; totalRevActual += revActual; totalRevAnnualTarget += revAnnualTarget;

      return { team, ordTarget, ordActual, ordAnnualTarget, revTarget, revActual, revAnnualTarget };
    });

    function rowHtml(label, ordTarget, ordActual, ordAnnualTarget, revTarget, revActual, revAnnualTarget, isTotal) {
      const ordPct = ordTarget ? (ordActual / ordTarget * 100) : 0;
      const ordAnnualPct = ordAnnualTarget ? (ordActual / ordAnnualTarget * 100) : 0;
      const revPct = revTarget ? (revActual / revTarget * 100) : 0;
      const revAnnualPct = revAnnualTarget ? (revActual / revAnnualTarget * 100) : 0;
      return `<tr class="${isTotal ? 'totalRow' : ''}">
        <td>${label}</td>
        <td>${Math.round(ordTarget).toLocaleString('en-US')}</td>
        <td>${Math.round(ordActual).toLocaleString('en-US')}</td>
        <td class="${pctClass(ordPct)}">${ordPct.toFixed(1)}%</td>
        <td class="${pctClass(ordAnnualPct)}">${ordAnnualPct.toFixed(1)}%</td>
        <td>${Math.round(revTarget).toLocaleString('en-US')}</td>
        <td>${Math.round(revActual).toLocaleString('en-US')}</td>
        <td class="${pctClass(revPct)}">${revPct.toFixed(1)}%</td>
        <td class="${pctClass(revAnnualPct)}">${revAnnualPct.toFixed(1)}%</td>
      </tr>`;
    }

    html += rowHtml('본부 전체', totalOrdTarget, totalOrdActual, totalOrdAnnualTarget, totalRevTarget, totalRevActual, totalRevAnnualTarget, true);
    for (const r of teamRows) {
      html += rowHtml(r.team, r.ordTarget, r.ordActual, r.ordAnnualTarget, r.revTarget, r.revActual, r.revAnnualTarget, false);
    }

    document.getElementById('targetTable').innerHTML = html;
  }

  // ----- 막대그래프 (연간 -> 분기별 확장) + 변화 내용 -----
  const SET_META = [
    { key: 'order', label: '수주' },
    { key: 'revenue', label: '매출' },
    { key: 'other', label: '기타매출' },
  ];

  let selectedChangeTeam = '전체';

  function collectChangeTeamOptions() {
    const teams = new Set();
    // 회사 전체 팀 목록(목표대비실적)이 있으면 그걸 기준으로 삼는다 — 이번 비교에서
    // 변화가 없어서 monthDetails에 안 잡힌 팀도 옵션에는 항상 나오도록.
    if (DATA && DATA.targetVsActual && DATA.targetVsActual.teams) {
      DATA.targetVsActual.teams.forEach(t => teams.add(t));
    }
    const changes = (DATA && DATA.changes) || {};
    for (const key of Object.keys(changes)) {
      for (const list of changes[key].monthDetails) {
        for (const item of list) {
          if (item.team) teams.add(item.team);
        }
      }
    }
    return ['전체', ...Array.from(teams).sort()];
  }

  // monthDetails(팀 정보 포함)로부터, 선택한 팀만 골라 분기/총합을 다시 계산한다.
  function filterChangeByTeam(c, team) {
    const months = new Array(13).fill(0);
    const monthDetails = Array.from({ length: 13 }, () => []);
    for (let m = 1; m <= 12; m++) {
      const list = c.monthDetails[m - 1] || [];
      for (const item of list) {
        if (team === '전체' || item.team === team) {
          months[m] += item.delta;
          monthDetails[m - 1].push(item);
        }
      }
    }
    const q = [0, 0, 0, 0];
    for (let m = 1; m <= 12; m++) q[Math.floor((m - 1) / 3)] += months[m];
    const total = q[0] + q[1] + q[2] + q[3];
    return { q1: q[0], q2: q[1], q3: q[2], q4: q[3], total, months, monthDetails };
  }

  function renderCharts() {
    const chartArea = document.getElementById('chartArea');
    const changes = (DATA && DATA.changes) || {};
    const availableSets = SET_META.filter(s => changes[s.key]);
    if (availableSets.length === 0) {
      chartArea.innerHTML = '<div style="font-size:13px;color:#9A9689;">변화량 데이터가 없어요.</div>';
      return;
    }

    const teamOptions = collectChangeTeamOptions();
    let html = '';
    if (teamOptions.length > 2) {
      html += `<div style="margin-bottom:12px;">
        <label style="font-size:12px;color:#5B5F6B;margin-right:8px;">팀 선택</label>
        <select id="changeTeamSelect" style="font-size:13px;padding:5px 10px;border:1px solid #D8D3C7;border-radius:6px;background:#fff;color:#1A1D24;">
          ${teamOptions.map(t => `<option value="${t}" ${t === selectedChangeTeam ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>`;
    } else {
      selectedChangeTeam = '전체';
    }

    const filtered = {};
    for (const s of availableSets) filtered[s.key] = filterChangeByTeam(changes[s.key], selectedChangeTeam);
    const maxAbs = Math.max(1, ...availableSets.map(s => Math.abs(filtered[s.key].total)));

    html += availableSets.map((s) => {
      const c = filtered[s.key];
      const widthPct = Math.min(100, Math.abs(c.total) / maxAbs * 100);
      const cls = c.total >= 0 ? 'pos' : 'neg';
      return `
        <div class="barSet">
          <div class="barSet-label">${s.label}</div>
          <div class="barRow" data-set="${s.key}">
            <div class="barTrack"><div class="barFill ${cls}" style="width:${widthPct}%;"></div></div>
            <div class="barValue">${c.total >= 0 ? '+' : ''}${fmtWon(c.total)}</div>
          </div>
          <div class="quarterBars" id="qbars-${s.key}"></div>
        </div>`;
    }).join('');

    chartArea.innerHTML = html;

    const teamSelect = document.getElementById('changeTeamSelect');
    if (teamSelect) {
      teamSelect.addEventListener('change', (e) => {
        selectedChangeTeam = e.target.value;
        openSetKey = null;
        renderCharts();
        document.getElementById('detailArea').innerHTML = '<div class="empty">막대를 클릭하면 분기별 변화 내용이 여기 나와요.</div>';
      });
    }

    chartArea.querySelectorAll('.barRow').forEach((row) => {
      row.addEventListener('click', () => {
        const setKey = row.getAttribute('data-set');
        toggleQuarterBars(setKey, filtered[setKey]);
      });
    });
  }

  let openSetKey = null;

  function toggleQuarterBars(setKey, filteredChange) {
    // 다른 세트가 열려있으면 닫는다 (한 번에 하나만 펼침)
    if (openSetKey && openSetKey !== setKey) {
      const prevEl = document.getElementById(`qbars-${openSetKey}`);
      if (prevEl) prevEl.classList.remove('show');
    }
    const el = document.getElementById(`qbars-${setKey}`);
    const isOpen = el.classList.contains('show');
    if (isOpen) {
      el.classList.remove('show');
      openSetKey = null;
      document.getElementById('detailArea').innerHTML = '<div class="empty">막대를 클릭하면 분기별 변화 내용이 여기 나와요.</div>';
      return;
    }
    openSetKey = setKey;
    const c = filteredChange;
    const setLabel = SET_META.find(s => s.key === setKey).label;
    const quarters = [
      { label: '1분기', key: 'q1', months: [1, 2, 3] },
      { label: '2분기', key: 'q2', months: [4, 5, 6] },
      { label: '3분기', key: 'q3', months: [7, 8, 9] },
      { label: '4분기', key: 'q4', months: [10, 11, 12] },
    ];
    const maxAbsQ = Math.max(1, ...quarters.map(q => Math.abs(c[q.key])));
    function hasAnyDetail(months) { return months.some(m => (c.monthDetails[m - 1] || []).length > 0); }
    el.innerHTML = quarters.map((q) => {
      const val = c[q.key];
      const widthPct = Math.min(100, Math.abs(val) / maxAbsQ * 100);
      const cls = val >= 0 ? 'pos' : 'neg';
      const isCancelled = val === 0 && hasAnyDetail(q.months);
      const valueHtml = isCancelled
        ? `<span style="color:#B45309;">0<span style="font-size:10px;">±</span></span>`
        : `${val >= 0 ? '+' : ''}${fmtWon(val)}`;
      return `<div class="qBarRow">
        <div class="qBarLabel">${q.label}</div>
        <div class="qBarTrack"><div class="qBarFill ${cls}" style="width:${widthPct}%;"></div></div>
        <div class="qBarValue">${valueHtml}</div>
      </div>`;
    }).join('');
    el.classList.add('show');

    renderDetailText(setKey, setLabel, c, quarters);
  }

  function renderDetailText(setKey, setLabel, c, quarters) {
    const detailArea = document.getElementById('detailArea');
    const blocks = [];
    for (const q of quarters) {
      // 분기 안에서 프로젝트명으로 합치면 같은 분기 안에서의 이동(예: 7월→8월)이
      // 순변화 0으로 상쇄돼서 안 보이게 된다. 그래서 월 단위로 따로 보여준다.
      const monthLines = [];
      for (const m of q.months) {
        const list = (c.monthDetails[m - 1]) || [];
        if (list.length === 0) continue;
        const sorted = list.slice().sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
        const itemsHtml = sorted.map((item) => {
          const cls = item.delta > 0 ? 'pos' : 'neg';
          const sign = item.delta > 0 ? '+' : '';
          return `<div class="qItem">${item.name} : <span class="amt ${cls}">${sign}${fmtWon(item.delta)}</span></div>`;
        }).join('');
        monthLines.push(`<div style="margin-bottom:6px;"><div style="font-size:11px;color:#8A8F98;margin-bottom:2px;">${m}월</div>${itemsHtml}</div>`);
      }
      if (monthLines.length === 0) continue; // 이 분기엔 어느 달에도 변화가 없음 -> 생략

      blocks.push(`<div class="detailQuarter"><div class="qTitle">${q.label}</div>${monthLines.join('')}</div>`);
    }
    if (blocks.length === 0) {
      detailArea.innerHTML = `<div class="empty">${setLabel}에는 분기별로 특별한 변화가 없었어요.</div>`;
    } else {
      detailArea.innerHTML = blocks.join('');
    }
  }

  // ----- TOP10 기능: 시작월/종료월 선택 -> 팀별 매출/수주 상위 10개 프로젝트 -----
  function renderTop10Feature() {
    const container = document.getElementById('featureContent');
    const projects = DATA && DATA.projects;
    if (!projects || (!projects.revenue.length && !projects.order.length)) {
      container.innerHTML = '<div class="card"><div style="font-size:13px;color:#9A9689;">TOP10을 계산할 프로젝트 데이터가 없어요.</div></div>';
      return;
    }
    container.innerHTML = `
      <div class="card">
        <div class="range-inputs" style="margin-bottom:14px;">
          <label style="font-size:12px;color:#5B5F6B;margin-right:6px;">시작월</label>
          <input type="number" id="top10Start" min="1" max="12" value="1" />
          <label style="font-size:12px;color:#5B5F6B;margin:0 6px 0 14px;">종료월</label>
          <input type="number" id="top10End" min="1" max="12" value="12" />
        </div>
        <div id="top10Body"></div>
      </div>
    `;
    document.getElementById('top10Start').addEventListener('input', renderTop10Body);
    document.getElementById('top10End').addEventListener('input', renderTop10Body);
    renderTop10Body();
  }

  function rankTop10(records, team, start, end) {
    const rows = records
      .filter(r => r.team === team)
      .map(r => ({ name: r.name, sum: sumRange(r.monthAmt, start, end) }))
      .filter(r => r.sum !== 0)
      .sort((a, b) => b.sum - a.sum)
      .slice(0, 10);
    return rows;
  }

  function top10TableHtml(title, rows) {
    if (rows.length === 0) return `<div style="font-size:12px;color:#9A9689;margin-bottom:16px;">${title}: 해당 구간에 데이터가 없어요.</div>`;
    return `<div style="margin-bottom:16px;">
      <div style="font-size:12px;font-weight:600;color:#3A3D45;margin-bottom:6px;">${title}</div>
      <table class="dataTable"><tr><th style="width:30px;">#</th><th>프로젝트</th><th>금액</th></tr>
      ${rows.map((r, i) => `<tr><td>${i + 1}</td><td style="text-align:left;">${r.name}</td><td>${fmtWon(r.sum)}</td></tr>`).join('')}
      </table>
    </div>`;
  }

  function renderTop10Body() {
    const start = Math.max(1, Math.min(12, Number(document.getElementById('top10Start').value) || 1));
    const end = Math.max(1, Math.min(12, Number(document.getElementById('top10End').value) || 12));
    const projects = DATA.projects;
    const teamSet = new Set();
    projects.revenue.forEach(r => teamSet.add(r.team));
    projects.order.forEach(r => teamSet.add(r.team));
    const teams = Array.from(teamSet).sort();

    let html = '';
    for (const team of teams) {
      const revRows = rankTop10(projects.revenue, team, start, end);
      const ordRows = rankTop10(projects.order, team, start, end);
      html += `<div style="margin-bottom:24px;">
        <div style="font-size:14px;font-weight:700;color:#1A1D24;margin-bottom:10px;">${team}</div>
        <div class="split-row">
          <div>${top10TableHtml('수주 TOP10', ordRows)}</div>
          <div>${top10TableHtml('매출 TOP10', revRows)}</div>
        </div>
      </div>`;
    }
    document.getElementById('top10Body').innerHTML = html || '<div style="font-size:13px;color:#9A9689;">표시할 팀이 없어요.</div>';
  }

  // ----- 매출일정 기능: 전사 모든 프로젝트를 팀별로 묶어서 1~12월 금액을 표로 -----
  function hqOfTeam(team) {
    const idx = team.indexOf('본부');
    return idx === -1 ? team : team.slice(0, idx + 2);
  }

  function fmtThousand(n) {
    if (!n) return '';
    return Math.round(n / 1000).toLocaleString('en-US');
  }

  let scheduleViewMode = {}; // hq -> '통합' | '팀별'

  function renderScheduleFeature() {
    const container = document.getElementById('featureContent');
    const projects = DATA && DATA.projects;
    const maSchedule = (DATA && DATA.maSchedule) || { revenue: [], order: [] };
    if (!projects || !projects.revenue.length) {
      container.innerHTML = '<div class="card"><div style="font-size:13px;color:#9A9689;">매출일정 데이터가 없어요.</div></div>';
      return;
    }
    const teamSet = new Set();
    projects.revenue.forEach(r => teamSet.add(r.team));
    maSchedule.revenue.forEach(r => teamSet.add(r.team));
    const teams = Array.from(teamSet).sort();

    const hqMap = new Map(); // hq -> [teams...]
    for (const team of teams) {
      const hq = hqOfTeam(team);
      if (!hqMap.has(hq)) hqMap.set(hq, []);
      hqMap.get(hq).push(team);
    }

    container.innerHTML = Array.from(hqMap.keys()).sort().map(hq => `<div class="card" id="hqCard-${cssSafe(hq)}"></div>`).join('');
    for (const hq of hqMap.keys()) renderHqScheduleCard(hq, hqMap.get(hq), projects, maSchedule);
  }

  function cssSafe(s) { return s.replace(/[^a-zA-Z0-9가-힣]/g, '_'); }

  function sumArr(arr) { return arr.reduce((s, v) => s + v, 0); }
  function sumRange0(arr, startIdx, endIdxExclusive) {
    let s = 0;
    for (let i = startIdx; i < endIdxExclusive; i++) s += arr[i];
    return s;
  }

  const monthHeaderCells = Array.from({ length: 12 }, (_, i) => `<th>${i + 1}월</th>`).join('');

  function sectionRowsHtml(rows) {
    const sorted = rows.slice().sort((a, b) => sumArr(b.monthAmt) - sumArr(a.monthAmt));
    return sorted.map((r) => {
      const total = sumArr(r.monthAmt);
      return `<tr><td style="text-align:left;">${r.name}</td>${r.monthAmt.map(v => `<td>${v ? fmtThousand(v) : '<span style="color:#D8D3C7;">–</span>'}</td>`).join('')}<td style="font-weight:600;">${fmtThousand(total)}</td></tr>`;
    }).join('');
  }

  function subtotalRowHtml(label, monthsArr, bg) {
    const total = sumArr(monthsArr);
    return `<tr style="background:${bg};"><td style="text-align:left;font-weight:600;">${label}</td>${monthsArr.map(v => `<td>${v ? fmtThousand(v) : '<span style="color:#D8D3C7;">–</span>'}</td>`).join('')}<td style="font-weight:700;">${fmtThousand(total)}</td></tr>`;
  }

  function monthsOf(rows) {
    const m = new Array(12).fill(0);
    for (const r of rows) for (let i = 0; i < 12; i++) m[i] += r.monthAmt[i];
    return m;
  }

  // 프로젝트(솔루션, 기계약/신규로 구분) + MA(통합 1줄)을 받아
  // "1.기계약 2.신규 3.MA" 3구간 + 합계 + 분기별 누적을 그린다.
  function scheduleTableAndCumHtml(solutionRows, maRows) {
    const existingRows = solutionRows.filter(r => r.section === '기계약');
    const newRows = solutionRows.filter(r => r.section === '신규');
    const maTotal = new Array(12).fill(0);
    for (const maRow of maRows) for (let m = 0; m < 12; m++) maTotal[m] += maRow.monthAmt[m];
    const hasMA = sumArr(maTotal) !== 0;
    if (existingRows.length === 0 && newRows.length === 0 && !hasMA) {
      return '<div style="font-size:12px;color:#9A9689;margin-bottom:12px;">데이터가 없어요.</div>';
    }

    let rowsHtml = '';
    if (existingRows.length > 0) {
      rowsHtml += `<tr><td colspan="14" style="text-align:left;font-size:11px;color:#8A8F98;font-weight:600;padding-top:10px;">1. 기계약 프로젝트 (Backlog)</td></tr>`;
      rowsHtml += sectionRowsHtml(existingRows);
      rowsHtml += subtotalRowHtml('기계약 소계', monthsOf(existingRows), '#F2F2F2');
    }
    if (newRows.length > 0) {
      rowsHtml += `<tr><td colspan="14" style="text-align:left;font-size:11px;color:#8A8F98;font-weight:600;padding-top:10px;">2. 신규 프로젝트</td></tr>`;
      rowsHtml += sectionRowsHtml(newRows);
      rowsHtml += subtotalRowHtml('신규 소계', monthsOf(newRows), '#F2F2F2');
    }
    if (hasMA) {
      rowsHtml += `<tr><td colspan="14" style="text-align:left;font-size:11px;color:#8A8F98;font-weight:600;padding-top:10px;">3. MA</td></tr>`;
      rowsHtml += subtotalRowHtml('MA (통합)', maTotal, '#EFEAF6');
    }

    const grandTotalMonths = new Array(12).fill(0);
    for (let m = 0; m < 12; m++) grandTotalMonths[m] = monthsOf(existingRows)[m] + monthsOf(newRows)[m] + (hasMA ? maTotal[m] : 0);
    const grandTotal = sumArr(grandTotalMonths);
    rowsHtml += `<tr class="totalRow"><td style="text-align:left;">(기계약+신규+MA) 합계</td>${grandTotalMonths.map(v => `<td>${v ? fmtThousand(v) : ''}</td>`).join('')}<td>${fmtThousand(grandTotal)}</td></tr>`;

    const cum = [3, 6, 9, 12].map((endMonth, i) => {
      const label = i === 0 ? '1분기' : `1~${i + 1}분기 누적`;
      const val = sumRange0(grandTotalMonths, 0, endMonth);
      return { label, val };
    });
    const cumHtml = `<div style="display:flex;gap:14px;margin:10px 0 4px;">
      ${cum.map(c => `<div style="flex:1;background:#FAFAF7;border:1px solid #E4E0D5;border-radius:8px;padding:10px 12px;">
        <div style="font-size:11px;color:#8A8F98;margin-bottom:4px;">${c.label}</div>
        <div style="font-size:14px;font-weight:700;color:#1A1D24;">${fmtThousand(c.val)}</div>
      </div>`).join('')}
    </div>`;

    return `
      <table class="dataTable" style="width:100%;table-layout:fixed;font-size:12px;">
        <colgroup><col style="width:22%;">${'<col>'.repeat(12)}<col style="width:8%;"></colgroup>
        <tr><th style="text-align:left;">프로젝트</th>${monthHeaderCells}<th>합계</th></tr>
        ${rowsHtml}
      </table>
      ${cumHtml}
    `;
  }

  function renderHqScheduleCard(hq, teamsInHq, projects, maSchedule) {
    const card = document.getElementById(`hqCard-${cssSafe(hq)}`);
    const scope = scheduleViewMode[hq] || '통합'; // '통합' 또는 특정 팀 이름
    const showButtons = teamsInHq.length > 1;

    let buttonsHtml = '';
    if (showButtons) {
      const options = ['통합', ...teamsInHq];
      buttonsHtml = `<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;">
        ${options.map((opt) => {
          const isActive = scope === opt;
          const label = opt === '통합' ? '본부 통합' : opt.replace(hq, '').trim();
          return `<button class="scheduleToggleBtn" data-hq="${cssSafe(hq)}" data-scope="${opt}" style="font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid ${isActive ? '#3A3D45' : '#D8D3C7'};background:${isActive ? '#3A3D45' : '#fff'};color:${isActive ? '#fff' : '#5B5F6B'};cursor:pointer;">${label}</button>`;
        }).join('')}
      </div>`;
    }

    const unitNote = '<div style="font-size:11px;color:#9A9689;margin-bottom:10px;">단위: 천원</div>';
    let solutionRows, maRows, scopeLabel;
    if (scope === '통합' || !showButtons) {
      solutionRows = projects.revenue.filter(r => teamsInHq.includes(r.team));
      maRows = maSchedule.revenue.filter(r => teamsInHq.includes(r.team));
      scopeLabel = hq;
    } else {
      solutionRows = projects.revenue.filter(r => r.team === scope);
      maRows = maSchedule.revenue.filter(r => r.team === scope);
      scopeLabel = scope;
    }
    const bodyHtml = unitNote + scheduleTableAndCumHtml(solutionRows, maRows);

    card.innerHTML = `<div class="card-title">${scopeLabel} — 매출일정</div>${buttonsHtml}<div id="scheduleBody-${cssSafe(hq)}">${bodyHtml}</div>`;

    card.querySelectorAll('.scheduleToggleBtn').forEach((btn) => {
      btn.addEventListener('click', () => {
        scheduleViewMode[hq] = btn.getAttribute('data-scope');
        renderHqScheduleCard(hq, teamsInHq, projects, maSchedule);
      });
    });
  }

  // ----- 초기화: results.json 로드 -----
  async function init() {
    renderNav();
    try {
      const res = await fetch('./data/results.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('results.json을 찾을 수 없어요');
      DATA = await res.json();
    } catch (e) {
      DATA = null;
      document.getElementById('featureContent').innerHTML = `<div class="card"><div style="font-size:13px;color:#A32D2D;">결과 데이터를 불러오지 못했어요.<br><span style="font-size:12px;color:#5B5F6B;">${e.message} — data/results.json이 이 페이지와 같은 저장소의 data 폴더 안에 있는지 확인해주세요.</span></div></div>`;
      renderFeature('main');
      return;
    }
    renderFeature('main');
  }

  init();
})();
</script>

</body>
</html>
