<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영업 포털</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --bg: #F8F6FD;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --ink: #241F33;
    --ink-70: rgba(36,31,51,.72);
    --ink-55: rgba(36,31,51,.55);
    --ink-40: rgba(36,31,51,.38);
    --border: #EAE4F7;
    --border-strong: #D8CDF0;
    --accent: #7C5CFC;
    --accent-soft: #EDE7FD;
    --sidebar-bg: #FFFFFF;
    --nav-idle: #F0EBFB;
    --nav-active: #7C5CFC;
    --pos: #C0503B;
    --pos-soft: #E7A79A;
    --neg: #3D6B96;
    --neg-soft: #9AB9D3;
    --good: #3E7A4E;
    --warn: #B4791E;
    --bad: #B3402C;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-card: 0 1px 2px rgba(36,34,29,.04), 0 1px 10px rgba(36,34,29,.03);
    --font: 'Pretendard Variable', 'Pretendard', 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font);
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .appShell { min-height: 100vh; }
  .topNav {
    background: var(--sidebar-bg); border-bottom: 1px solid var(--border);
    padding: 14px 32px; display: flex; align-items: center; gap: 28px;
    flex-wrap: wrap;
  }
  .brandLabel {
    font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .01em;
    flex-shrink: 0; white-space: nowrap;
  }
  .tabList { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav-item {
    background: transparent; border-radius: var(--radius-md); padding: 9px 16px;
    font-size: 13.5px; font-weight: 500; color: var(--ink-70); text-align: center; cursor: pointer;
    transition: background .15s, color .15s, transform .1s;
  }
  .nav-item.active { background: var(--nav-active); color: #FFF; font-weight: 600; }
  .nav-item:not(.active):hover { background: var(--border-strong); color: var(--ink); }
  .nav-item:active { transform: scale(.98); }
  .main-content { padding: 32px 36px; max-width: 1500px; min-width: 0; margin: 0 auto; }
  #pageTitle { font-family: var(--font); letter-spacing: -.01em; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 22px 24px; margin-bottom: 20px;
  }
  .card-title {
    font-size: 12.5px; color: #FFF; letter-spacing: .02em;
    margin: -22px -24px 16px; padding: 11px 18px; font-weight: 700;
    background: var(--ink); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    display: flex; align-items: center; gap: 7px;
  }
  .card-title::before { content: '◆'; font-size: 10px; color: var(--accent-soft); }

  /* ----- 메인화면 그리드 레이아웃 ----- */
  .mainGrid {
    display: grid; gap: 18px;
    grid-template-columns: 1.35fr 1fr;
    grid-template-areas:
      "filter filter"
      "kpi kpi"
      "chart detail";
  }
  .mainGrid .card { margin-bottom: 0; }
  .filterBar {
    grid-area: filter; display: flex; align-items: center; gap: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card); padding: 14px 22px;
  }
  .filterGroup { display: flex; align-items: center; gap: 10px; }
  .filterIcon { color: var(--accent); font-size: 10px; }
  .filterBar label { font-size: 12.5px; color: var(--ink-55); font-weight: 600; }
  .filterBar select {
    font-size: 13.5px; padding: 7px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface-raised); color: var(--ink); font-weight: 500; cursor: pointer;
  }
  .filterDivider { width: 1px; height: 24px; background: var(--border-strong); margin: 0 26px; }

  .kpiRow { grid-area: kpi; display: flex; flex-direction: column; gap: 14px; }
  .kpiTargetBar {
    display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px 24px;
  }
  .kpiTargetItem { flex: 1; text-align: center; }
  .kpiTargetLabel { display: block; font-size: 12px; color: var(--ink-55); font-weight: 600; margin-bottom: 6px; }
  .kpiTargetValue { font-size: 19px; font-weight: 800; font-family: var(--mono); }
  .kpiTargetDivider { width: 1px; height: 34px; background: var(--border-strong); }
  .kpiGrid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpiMiniBox {
    border-radius: var(--radius-lg); padding: 16px 12px; background: var(--surface);
    border: 1px solid var(--border); box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .kpiMiniLabel { font-size: 12.5px; font-weight: 700; color: var(--ink); margin-top: 8px; }
  .kpiMiniValue { font-size: 13px; font-weight: 700; color: var(--ink); font-family: var(--mono); margin-top: 4px; }
  .kpiMiniSub { font-size: 10.5px; color: var(--ink-40); margin-top: 2px; }
  .kpiBox {
    border-radius: var(--radius-lg); padding: 18px 20px; background: var(--surface);
    border: 1px solid var(--border); box-shadow: var(--shadow-card);
  }
  .kpiBoxTitle { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
  .kpiTier { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .kpiTier:last-of-type { border-bottom: none; }
  .kpiTierLabel { font-size: 12px; color: var(--ink-55); font-weight: 500; }
  .kpiTierValue { font-size: 15px; font-weight: 700; color: var(--ink); font-family: var(--mono); }
  .kpiPct { font-size: 11px; font-weight: 700; font-family: var(--font); margin-left: 4px; }
  .kpiPct.good { color: var(--good); }
  .kpiPct.warn { color: var(--warn); }
  .kpiActual { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0 0; font-size: 12px; color: var(--ink-55); font-weight: 500; }
  .kpiActualPending { font-size: 11px; color: var(--ink-40); font-style: italic; }
  table.dataTable { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.dataTable th, table.dataTable td { padding: 8px 10px; text-align: right; }
  table.dataTable th:first-child, table.dataTable td:first-child { text-align: left; }
  table.dataTable th { border-bottom: 1.5px solid var(--border-strong); color: var(--ink-70); font-weight: 700; font-size: 12px; }
  table.dataTable td { border-bottom: 1px solid var(--border); }
  table.dataTable tr:last-child td { border-bottom: none; }
  table.dataTable tr.totalRow { background: var(--accent-soft); font-weight: 700; }
  table.dataTable tr.totalRow td { border-bottom: none; }
  .pct-good { color: var(--good); font-weight: 700; }
  .pct-warn { color: var(--warn); font-weight: 700; }
  .pct-bad { color: var(--bad); font-weight: 700; }
  .range-inputs input {
    width: 60px; padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    font-family: var(--mono); font-size: 13px; text-align: center; background: var(--surface-raised); color: var(--ink);
  }
  .range-inputs input:focus, select:focus { outline: none; border-color: var(--accent); }
  .split-row { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 28px; }
  .split-row .card { flex: 1; margin-bottom: 0; min-width: 0; }
  .barSet { margin-bottom: 22px; }
  .barSet-label { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .barRow { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 0; }
  .barTrack { flex: 1; height: 22px; background: var(--border); border-radius: var(--radius-sm); position: relative; overflow: hidden; }
  .barFill { height: 100%; border-radius: var(--radius-sm); transition: width .25s ease; }
  .barFill.pos { background: var(--pos); }
  .barFill.neg { background: var(--neg); }
  .barValue { font-size: 12.5px; font-weight: 700; width: 110px; text-align: right; white-space: nowrap; font-family: var(--mono); }
  .quarterBars { display: none; margin: 10px 0 4px 0; padding: 12px 14px; background: var(--bg); border-radius: var(--radius-md); }
  .quarterBars.show { display: block; }
  .qBarRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
  .qBarLabel { width: 46px; font-size: 12px; color: var(--ink-55); }
  .qBarTrack { flex: 1; height: 16px; background: var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .qBarFill { height: 100%; }
  .qBarFill.pos { background: var(--pos-soft); }
  .qBarFill.neg { background: var(--neg-soft); }

  /* ----- 세로 막대 (연간 총 변화량) ----- */
  .vBarChart { display: flex; align-items: flex-end; justify-content: space-around; height: 190px; gap: 20px; padding: 10px 4px 0; }
  .vBarGroup { display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; min-width: 0; }
  .vBarValue { font-size: 12px; font-weight: 700; margin-bottom: 8px; font-family: var(--mono); white-space: nowrap; }
  .vBarTrack {
    width: 100%; max-width: 64px; height: 130px; display: flex; flex-direction: column; justify-content: flex-end;
    background: var(--border); border-radius: var(--radius-sm); overflow: hidden; transition: box-shadow .15s;
  }
  .vBarFill { width: 100%; transition: height .25s ease; }
  .vBarFill.pos { background: var(--pos); }
  .vBarFill.neg { background: var(--neg); }
  .vBarLabel { font-size: 13px; font-weight: 600; margin-top: 8px; color: var(--ink); }
  .vBarGroup.active .vBarTrack { box-shadow: 0 0 0 2px var(--accent); }
  .vBarGroup:hover .vBarTrack { box-shadow: 0 0 0 2px var(--border-strong); }

  /* ----- 변화 내용: 분기 요약 목록 ----- */
  .qSummaryHint { font-size: 11.5px; color: var(--ink-40); margin-bottom: 10px; }
  .qSummaryRow {
    display: flex; justify-content: space-between; align-items: center; padding: 11px 14px;
    border-radius: var(--radius-md); cursor: pointer; margin-bottom: 6px; background: var(--bg);
    transition: background .15s;
  }
  .qSummaryRow:hover { background: var(--border); }
  .qSummaryLabel { font-size: 13px; color: var(--ink-70); font-weight: 500; }
  .qSummaryValue { font-size: 13.5px; font-weight: 700; font-family: var(--mono); }
  .qSummaryValue.good { color: var(--good); }
  .qSummaryValue.bad { color: var(--bad); }
  .qSummaryValue.cancelled { color: var(--warn); }

  /* ----- 분기 상세 팝업 ----- */
  #detailModalBackdrop { display: none; position: fixed; inset: 0; background: rgba(20,20,20,.45); z-index: 1000; }
  #detailModal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: #fff; border-radius: var(--radius-lg); box-shadow: 0 8px 30px rgba(0,0,0,.2);
    max-width: 460px; width: 90%; max-height: 70vh; overflow-y: auto; z-index: 1001; padding: 20px 22px;
  }
  #detailModalTitle { font-size: 15px; font-weight: 700; color: var(--ink); }
  #detailModalClose { border: none; background: none; font-size: 20px; color: var(--ink-40); cursor: pointer; line-height: 1; }
  .modalItem { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .modalItem:last-child { border-bottom: none; }
  .modalItem .amt { font-weight: 700; font-family: var(--mono); white-space: nowrap; }
  .modalItem .amt.pos { color: var(--good); }
  .modalItem .amt.neg { color: var(--bad); }
  .qBarValue { font-size: 11.5px; width: 90px; text-align: right; font-family: var(--mono); }
  #detailArea .empty { color: var(--ink-40); font-size: 13px; }
  .detailQuarter { margin-bottom: 14px; }
  .detailQuarter .qTitle { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .detailQuarter .qItem { font-size: 12px; color: var(--ink-70); padding: 2px 0 2px 10px; }
  .detailQuarter .qItem .amt.pos { color: var(--good); font-weight: 600; }
  .detailQuarter .qItem .amt.neg { color: var(--bad); font-weight: 600; }
  select, button { font-family: var(--font); }

  /* ----- 반응형 (모바일) ----- */
  @media (max-width: 768px) {
    .topNav {
      padding: 12px 16px; gap: 12px; overflow-x: auto;
    }
    .tabList { flex-wrap: nowrap; }
    .nav-item { white-space: nowrap; flex-shrink: 0; padding: 8px 13px; }
    .main-content { padding: 18px 16px; max-width: 100%; }
    .split-row, .top10SplitRow { flex-direction: column; gap: 16px; }
    .mainGrid { grid-template-columns: 1fr; grid-template-areas: "filter" "kpi" "chart" "detail"; }
    .filterBar { flex-direction: column; align-items: flex-start; gap: 12px; }
    .filterDivider { display: none; }
    .card { padding: 16px 14px; }
    .card-title { margin: -16px -14px 14px; }
    .kpiRow { grid-template-columns: 1fr; gap: 10px; }
    .kpiBox { min-width: 0; }
    .kpiGrid4 { grid-template-columns: repeat(2, 1fr); }
    .kpiTargetBar { flex-direction: column; gap: 10px; }
    .kpiTargetDivider { display: none; }
    table.dataTable { font-size: 11.5px; }
    table.dataTable th, table.dataTable td { padding: 6px 6px; }
    .barValue { width: 88px; font-size: 11px; }
    #pageTitle { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="appShell">
  <div class="topNav">
    <div class="brandLabel">&#10070; INZENT 세일즈 포털</div>
    <div id="navList" class="tabList"></div>
  </div>
  <div class="main-content">
    <h2 id="pageTitle" style="font-size:18px;font-weight:600;margin:0 0 18px;"></h2>
    <div id="featureContent"></div>
  </div>
</div>

<div id="detailModalBackdrop"></div>
<div id="detailModal">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <div id="detailModalTitle"></div>
    <button id="detailModalClose">&times;</button>
  </div>
  <div id="detailModalBody"></div>
</div>

<script>
(function () {
  const FEATURES = [
    { id: 'main', label: '메인화면' },
    { id: 'top10', label: 'TOP10' },
    { id: 'schedule', label: '매출일정' },
    { id: 'changeDetail', label: '변화 상세' },
    { id: 'checklist', label: '계약 만기' },
    { id: 'rfp', label: '입찰공고', iframeUrl: 'https://oosnuyh.github.io/RPF/' },
    { id: 'ppt', label: 'PPT 폰트·컬러 정리', iframeUrl: './ppt-style-tool.html' },
  ];

  let DATA = null;

  function fmtWon(n) {
    const sign = n < 0 ? '-' : '';
    return sign + Math.round(Math.abs(n)).toLocaleString('en-US') + '원';
  }

  function pctClass(p) {
    if (p >= 100) return 'pct-good';
    if (p >= 90) return 'pct-warn';
    return 'pct-bad';
  }

  // ----- 사이드바 -----
  function renderNav() {
    const navList = document.getElementById('navList');
    navList.innerHTML = FEATURES.map((f, i) =>
      `<div class="nav-item ${i === 0 ? 'active' : ''}" data-id="${f.id}">${f.label}</div>`
    ).join('');
    navList.querySelectorAll('.nav-item').forEach((el) => {
      el.addEventListener('click', () => {
        navList.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        renderFeature(el.getAttribute('data-id'));
      });
    });
  }

  function renderFeature(id) {
    const feature = FEATURES.find(f => f.id === id) || FEATURES[0];
    document.getElementById('pageTitle').textContent = feature.label;
    if (feature.id === 'main') renderMainFeature();
    if (feature.id === 'top10') renderTop10Feature();
    if (feature.id === 'schedule') renderScheduleFeature();
    if (feature.id === 'changeDetail') renderChangeDetailFeature();
    if (feature.id === 'checklist') renderChecklistFeature();
    if (feature.iframeUrl) renderIframeFeature(feature.iframeUrl);
  }

  function renderIframeFeature(url) {
    const container = document.getElementById('featureContent');
    function buildUrl() {
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}_cb=${Date.now()}`;
    }
    container.innerHTML = `<div style="margin-bottom:10px;display:flex;justify-content:flex-end;">
      <button id="rfpRefreshBtn" style="font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid #D8D3C7;background:#fff;color:#5B5F6B;cursor:pointer;">새로고침</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <iframe id="rfpIframe" src="${buildUrl()}" style="width:100%;height:calc(100vh - 180px);border:none;display:block;"></iframe>
    </div>`;
    document.getElementById('rfpRefreshBtn').addEventListener('click', () => {
      document.getElementById('rfpIframe').src = buildUrl();
    });
  }

  // ----- 메인화면: 구간별 실적조회 + 변화량 그래프 -----
  let mainFilter = { team: '전체', startMonth: 1, endMonth: 12 };

  function teamsForFilterValue(value, tva) {
    if (!tva) return [];
    if (value === '전체') return tva.teams;
    if (tva.teams.includes(value)) return [value]; // 특정 팀
    return tva.teams.filter(t => hqOfTeam(t) === value); // 특정 본부
  }

  function buildScopeOptions(tva) {
    if (!tva) return ['전체'];
    const hqSet = new Set(tva.teams.map(t => hqOfTeam(t)));
    return { hqs: Array.from(hqSet), teams: tva.teams };
  }

  function renderMainFeature() {
    const container = document.getElementById('featureContent');
    const tva = DATA && DATA.targetVsActual;
    const scopes = buildScopeOptions(tva);

    let scopeOptionsHtml = '<option value="전체">전체</option>';
    if (tva) {
      scopeOptionsHtml += `<optgroup label="본부">${scopes.hqs.map(h => `<option value="${h}">${h}</option>`).join('')}</optgroup>`;
      scopeOptionsHtml += `<optgroup label="팀">${scopes.teams.map(t => `<option value="${t}">${t}</option>`).join('')}</optgroup>`;
    }

    container.innerHTML = `
      <div class="mainGrid">
        <div class="filterBar">
          <div class="filterGroup"><span class="filterIcon">◆</span>
            <label>본부/팀</label>
            <select id="mainTeamFilter">${scopeOptionsHtml}</select>
          </div>
          <div class="filterDivider"></div>
          <div class="filterGroup"><span class="filterIcon">◆</span>
            <label>시작월</label>
            <input type="number" id="mainStartMonth" min="1" max="12" value="${mainFilter.startMonth}" style="width:52px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-family:var(--mono);font-size:13px;text-align:center;" />
            <label>종료월</label>
            <input type="number" id="mainEndMonth" min="1" max="12" value="${mainFilter.endMonth}" style="width:52px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-family:var(--mono);font-size:13px;text-align:center;" />
          </div>
        </div>
        <div id="kpiRow" style="grid-area:kpi;"></div>
        <div class="card" id="chartCard" style="grid-area:chart;"><div class="card-title">전주대비 증감</div><div id="chartArea"></div></div>
        <div class="card" id="detailCard" style="grid-area:detail;"><div class="card-title">변화 내용</div><div id="detailArea"><div class="empty">막대를 클릭하면 분기별 변화 내용이 여기 나와요.</div></div></div>
      </div>
    `;

    document.getElementById('mainTeamFilter').value = mainFilter.team;
    document.getElementById('mainTeamFilter').addEventListener('change', (e) => { mainFilter.team = e.target.value; refreshMainFeature(); });
    document.getElementById('mainStartMonth').addEventListener('input', (e) => { mainFilter.startMonth = Math.max(1, Math.min(12, Number(e.target.value) || 1)); renderKpiCards(); });
    document.getElementById('mainEndMonth').addEventListener('input', (e) => { mainFilter.endMonth = Math.max(1, Math.min(12, Number(e.target.value) || 12)); renderKpiCards(); });

    refreshMainFeature();
  }

  function refreshMainFeature() {
    renderKpiCards();
    renderCharts();
  }

  // ----- 핵심 지표 (KPI) 카드: 수주/매출 각각 목표 · 연간 예상액(목표대비%) · 실제 금액(연목표대비%) -----
  function donutSvg(pct, color, opts) {
    opts = opts || {};
    const size = opts.size || 84;
    const r = opts.r || 34, sw = opts.sw || 9;
    const cx = size / 2, cy = size / 2;
    const clamped = Math.max(0, Math.min(100, pct));
    const overAchieved = pct > 100;
    const circumference = 2 * Math.PI * r;
    const offset = circumference * (1 - clamped / 100);
    const numColor = overAchieved ? 'var(--good)' : 'var(--ink)';
    const ringColor = overAchieved ? 'var(--good)' : color;
    const fontSize = opts.fontSize || 16;
    const centerText = `<text x="${cx}" y="${cy + fontSize * 0.35}" text-anchor="middle" font-size="${fontSize}" font-weight="800" fill="${numColor}">${Math.round(pct)}%</text>`;
    // 100%를 넘으면 얼마나 초과했는지 오른쪽 위에 작은 뱃지로 같이 보여준다 (예: +20%).
    const badge = overAchieved
      ? `<g>
          <rect x="${cx + r * 0.35}" y="${cy - r - sw / 2 - 4}" width="${String(Math.round(pct - 100)).length * 6 + 16}" height="16" rx="8" fill="var(--good)"/>
          <text x="${cx + r * 0.35 + (String(Math.round(pct - 100)).length * 6 + 16) / 2}" y="${cy - r - sw / 2 + 7}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">+${Math.round(pct - 100)}%</text>
        </g>`
      : '';
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;overflow:visible;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${sw}"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${ringColor}" stroke-width="${sw}"
        stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
        stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
      ${centerText}
      ${badge}
    </svg>`;
  }

  function renderKpiCards() {
    const row = document.getElementById('kpiRow');
    const tva = DATA && DATA.targetVsActual;
    if (!tva) { row.innerHTML = ''; return; }

    const start = mainFilter.startMonth, end = mainFilter.endMonth;
    const teamsToSum = teamsForFilterValue(mainFilter.team, tva);

    let revTarget = 0, revExpected = 0, ordTarget = 0, ordExpected = 0;
    let revReal = 0, ordReal = 0;
    let revAnnualTarget = 0, ordAnnualTarget = 0;
    const hasRealData = !!(tva.revenueRealActuals && tva.orderRealActuals);
    for (const team of teamsToSum) {
      revTarget += sumRange(tva.revenueTargets[team], start, end);
      revExpected += sumRange(tva.revenueActuals[team], start, end);
      ordTarget += sumRange(tva.orderTargets[team], start, end);
      ordExpected += sumRange(tva.orderActuals[team], start, end);
      revAnnualTarget += sumRange(tva.revenueTargets[team], 1, 12);
      ordAnnualTarget += sumRange(tva.orderTargets[team], 1, 12);
      if (hasRealData) {
        revReal += sumRange(tva.revenueRealActuals[team], start, end);
        ordReal += sumRange(tva.orderRealActuals[team], start, end);
      }
    }
    const revExpPct = revTarget ? (revExpected / revTarget * 100) : 0;
    const ordExpPct = ordTarget ? (ordExpected / ordTarget * 100) : 0;
    const revRealPct = revAnnualTarget ? (revReal / revAnnualTarget * 100) : 0;
    const ordRealPct = ordAnnualTarget ? (ordReal / ordAnnualTarget * 100) : 0;
    const pLabel = `${start}월~${end}월`;

    const targetBarHtml = `<div class="kpiTargetBar">
      <div class="kpiTargetItem"><span class="kpiTargetLabel">수주 목표</span><span class="kpiTargetValue" style="color:#B5472F;">${fmtWon(ordTarget)}</span></div>
      <div class="kpiTargetDivider"></div>
      <div class="kpiTargetItem"><span class="kpiTargetLabel">매출 목표</span><span class="kpiTargetValue" style="color:#2E5FA3;">${fmtWon(revTarget)}</span></div>
    </div>`;

    function miniBoxHtml(label, amt, pct, color, sublabel, pending) {
      if (pending) {
        return `<div class="kpiMiniBox" style="border-top:3px solid ${color};">
          <div class="kpiMiniLabel">${label}</div>
          <div class="kpiActualPending" style="margin-top:20px;">데이터 연동 준비 중</div>
        </div>`;
      }
      const donutColor = pct >= 100 ? 'var(--good)' : color;
      return `<div class="kpiMiniBox" style="border-top:3px solid ${color};">
        ${donutSvg(pct, donutColor, { size: 68, r: 27, sw: 7, fontSize: 14 })}
        <div class="kpiMiniLabel">${label}</div>
        <div class="kpiMiniValue">${fmtWon(amt)}</div>
        <div class="kpiMiniSub">${sublabel}</div>
      </div>`;
    }

    row.innerHTML = `
      ${targetBarHtml}
      <div class="kpiGrid4">
        ${miniBoxHtml('수주 예상', ordExpected, ordExpPct, '#B5472F', `${pLabel} 목표대비`)}
        ${miniBoxHtml('수주 실제', ordReal, ordRealPct, '#B5472F', '연목표대비', !hasRealData)}
        ${miniBoxHtml('매출 예상', revExpected, revExpPct, '#2E5FA3', `${pLabel} 목표대비`)}
        ${miniBoxHtml('매출 실제', revReal, revRealPct, '#2E5FA3', '연목표대비', !hasRealData)}
      </div>
    `;
  }

  // ----- 계약 만기 체크리스트 -----
  // ----- 계약 만기 체크리스트 (독립 메뉴) -----
  // ----- 변화 상세 (독립 메뉴): 매출일정 변경/증가/감소/신규/제외/계약액변경 등 서술형 목록 -----
  function renderChangeDetailFeature() {
    const container = document.getElementById('featureContent');
    const dc = DATA && DATA.detailedChanges;
    if (!dc || Object.keys(dc).length === 0) {
      container.innerHTML = '<div class="card"><div style="font-size:13px;color:#9A9689;">변화 상세 데이터가 없어요.</div></div>';
      return;
    }
    container.innerHTML = SET_META.filter(s => dc[s.key]).map(s => `<div class="card" id="changeDetailCard-${s.key}"></div>`).join('');
    for (const s of SET_META) {
      if (dc[s.key]) renderChangeDetailCard(s.key, dc[s.key]);

  function changeTypeColor(type) {
    if (type === '증가' || type === '신규추가') return 'var(--good)';
    if (type === '감소' || type === '제외') return 'var(--bad)';
    return 'var(--ink-55)';
  }

  function renderChangeDetailCard(setKey, data) {
    const card = document.getElementById(`changeDetailCard-${setKey}`);
    const items = data.items || [];
    if (items.length === 0) {
      card.innerHTML = `<div class="card-title">${data.label} 변화 상세</div><div style="font-size:13px;color:#9A9689;">변화가 없어요.</div>`;
      return;
    }

    const grouped = new Map();
    const teamOrder = [];
    for (const it of items) {
      const team = it.team || '미분류';
      if (!grouped.has(team)) { grouped.set(team, []); teamOrder.push(team); }
      grouped.get(team).push(it);
    }

    let bodyHtml = '';
    let textLines = [];
    for (const team of teamOrder) {
      const teamItems = grouped.get(team);
      bodyHtml += `<div style="font-size:12px;font-weight:600;color:var(--ink-70);margin:14px 0 6px;">${team}</div>`;
      bodyHtml += `<ol style="font-size:13px;color:var(--ink);line-height:1.7;padding-left:20px;margin:0;">`;
      textLines.push(`${team}:`);
      teamItems.forEach((it, i) => {
        const amtText = it.amount ? ` (${it.amount >= 0 ? '+' : ''}${fmtWon(it.amount)})` : '';
        const color = changeTypeColor(it.type);
        bodyHtml += `<li style="margin-bottom:6px;"><b>${it.name}</b> ${it.text} <span style="color:${color};font-weight:600;">${amtText}</span></li>`;
        textLines.push(`  ${i + 1}. ${it.name} ${it.text}${amtText}`);
      });
      bodyHtml += `</ol>`;
    }

    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="card-title" style="margin-bottom:0;flex:1;">${data.label} 변화 상세 (${items.length}건)</div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin:-6px 0 10px;">
        <button class="changeDetailCopyBtn" style="font-size:12px;color:var(--ink-55);background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:5px 12px;cursor:pointer;">복사하기</button>
      </div>
      ${bodyHtml}
    `;

    const copyBtn = card.querySelector('.changeDetailCopyBtn');
    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(textLines.join('\n'));
          const original = copyBtn.textContent;
          copyBtn.textContent = '복사됨';
          setTimeout(() => { copyBtn.textContent = original; }, 1500);
        } catch (e) { /* 무시 */ }
      });
    }
  }

  function renderChecklistFeature() {
    const container = document.getElementById('featureContent');
    container.innerHTML = '<div class="card" id="checklistCard"></div>';
    renderChecklistBox();
  }

  function renderChecklistBox() {
    const card = document.getElementById('checklistCard');
    const rc = DATA && DATA.renewalChecklist;
    if (!rc || !rc.monthGroups || !rc.monthGroups.some(g => g.solutionFlagged.length > 0 || g.maFlagged.length > 0)) {
      card.innerHTML = '<div class="card-title">계약 만기 체크리스트</div><div style="font-size:13px;color:#9A9689;">지금 확인해야 할 계약 만기 항목이 없어요.</div>';
      return;
    }
    function offsetLabel(offset) { return offset === 0 ? '이번달' : `${offset}개월 후`; }
    let html = '<div class="card-title">계약 만기 체크리스트</div>';
    for (const g of rc.monthGroups) {
      if (g.solutionFlagged.length === 0 && g.maFlagged.length === 0) continue;
      const urgent = g.offset === 0;
      const color = urgent ? '#C0392B' : '#B45309';
      html += `<div style="margin-bottom:14px;">
        <div style="font-size:13px;font-weight:700;color:${color};margin-bottom:6px;">${g.year2}년 ${g.month}월 (${offsetLabel(g.offset)}${urgent ? ' — 시급' : ''})</div>`;
      if (g.solutionFlagged.length > 0) {
        html += `<div style="font-size:12px;color:${color};font-weight:600;margin:4px 0 2px;">솔루션 매출 — 무상보증 종료 (유상전환 검토)</div>`;
        html += g.solutionFlagged.map(item => `<div style="font-size:12px;color:#3A3D45;padding:2px 0 2px 10px;">${item.name}${item.period ? ` <span style="color:#9A9689;">(${item.period})</span>` : ''}${item.contract ? ` — ${fmtWon(item.contract)}` : ''}</div>`).join('');
      }
      if (g.maFlagged.length > 0) {
        html += `<div style="font-size:12px;color:${color};font-weight:600;margin:6px 0 2px;">MA 매출 — 계약 갱신 검토</div>`;
        html += g.maFlagged.map(item => `<div style="font-size:12px;color:#3A3D45;padding:2px 0 2px 10px;">${item.name}${item.contract ? ` — ${fmtWon(item.contract)}` : ''}</div>`).join('');
      }
      html += `</div>`;
    }
    card.innerHTML = html;
  }

  // ----- 구간별 실적조회 박스 -----


  function sumRange(arr, start, end) {
    let s = 0;
    for (let m = start; m <= end; m++) s += arr[m - 1] || 0;
    return s;
  }

  function renderTargetTable() {
    const tva = DATA.targetVsActual;
    if (!tva) { const t = document.getElementById('targetTable'); if (t) t.innerHTML = '<tr><td style="font-size:13px;color:#9A9689;">목표대비실적 데이터가 없어요.</td></tr>'; return; }
    const start = Math.max(1, Math.min(12, Number(document.getElementById('top10Start').value) || 1));
    const end = Math.max(1, Math.min(12, Number(document.getElementById('top10End').value) || 12));
    const teamsToShow = tva.teams;

    let html = `<tr>
      <th></th>
      <th>수주목표</th><th>수주실적</th><th>수주달성률</th><th>수주연목표대비</th>
      <th>매출목표</th><th>매출실적</th><th>매출달성률</th><th>매출연목표대비</th>
    </tr>`;

    let totalOrdTarget = 0, totalOrdActual = 0, totalOrdAnnualTarget = 0;
    let totalRevTarget = 0, totalRevActual = 0, totalRevAnnualTarget = 0;

    const teamRows = teamsToShow.map((team) => {
      const ordTarget = sumRange(tva.orderTargets[team], start, end);
      const ordActual = sumRange(tva.orderActuals[team], start, end);
      const ordAnnualTarget = sumRange(tva.orderTargets[team], 1, 12);
      const revTarget = sumRange(tva.revenueTargets[team], start, end);
      const revActual = sumRange(tva.revenueActuals[team], start, end);
      const revAnnualTarget = sumRange(tva.revenueTargets[team], 1, 12);

      totalOrdTarget += ordTarget; totalOrdActual += ordActual; totalOrdAnnualTarget += ordAnnualTarget;
      totalRevTarget += revTarget; totalRevActual += revActual; totalRevAnnualTarget += revAnnualTarget;

      return { team, ordTarget, ordActual, ordAnnualTarget, revTarget, revActual, revAnnualTarget };
    });

    function rowHtml(label, ordTarget, ordActual, ordAnnualTarget, revTarget, revActual, revAnnualTarget, isTotal) {
      const ordPct = ordTarget ? (ordActual / ordTarget * 100) : 0;
      const ordAnnualPct = ordAnnualTarget ? (ordActual / ordAnnualTarget * 100) : 0;
      const revPct = revTarget ? (revActual / revTarget * 100) : 0;
      const revAnnualPct = revAnnualTarget ? (revActual / revAnnualTarget * 100) : 0;
      return `<tr class="${isTotal ? 'totalRow' : ''}">
        <td>${label}</td>
        <td>${Math.round(ordTarget).toLocaleString('en-US')}</td>
        <td>${Math.round(ordActual).toLocaleString('en-US')}</td>
        <td class="${pctClass(ordPct)}">${ordPct.toFixed(1)}%</td>
        <td class="${pctClass(ordAnnualPct)}">${ordAnnualPct.toFixed(1)}%</td>
        <td>${Math.round(revTarget).toLocaleString('en-US')}</td>
        <td>${Math.round(revActual).toLocaleString('en-US')}</td>
        <td class="${pctClass(revPct)}">${revPct.toFixed(1)}%</td>
        <td class="${pctClass(revAnnualPct)}">${revAnnualPct.toFixed(1)}%</td>
      </tr>`;
    }

    html += rowHtml('본부 전체', totalOrdTarget, totalOrdActual, totalOrdAnnualTarget, totalRevTarget, totalRevActual, totalRevAnnualTarget, true);
    for (const r of teamRows) {
      html += rowHtml(r.team, r.ordTarget, r.ordActual, r.ordAnnualTarget, r.revTarget, r.revActual, r.revAnnualTarget, false);
    }

    document.getElementById('targetTable').innerHTML = html;
  }

  // ----- 막대그래프 (연간 -> 분기별 확장) + 변화 내용 -----
  const SET_META = [
    { key: 'order', label: '수주' },
    { key: 'revenue', label: '매출' },
    { key: 'other', label: '기타매출' },
  ];

  // monthDetails(팀 정보 포함)로부터, 선택한 팀만 골라 분기/총합을 다시 계산한다.
  function filterChangeByTeam(c, scope) {
    const months = new Array(13).fill(0);
    const monthDetails = Array.from({ length: 13 }, () => []);
    for (let m = 1; m <= 12; m++) {
      const list = c.monthDetails[m - 1] || [];
      for (const item of list) {
        const matches = scope === '전체' || item.team === scope || (item.team && hqOfTeam(item.team) === scope);
        if (matches) {
          months[m] += item.delta;
          monthDetails[m - 1].push(item);
        }
      }
    }
    const q = [0, 0, 0, 0];
    for (let m = 1; m <= 12; m++) q[Math.floor((m - 1) / 3)] += months[m];
    const total = q[0] + q[1] + q[2] + q[3];
    return { q1: q[0], q2: q[1], q3: q[2], q4: q[3], total, months, monthDetails };
  }

  function renderCharts() {
    const chartArea = document.getElementById('chartArea');
    const changes = (DATA && DATA.changes) || {};
    const availableSets = SET_META.filter(s => changes[s.key]);
    if (availableSets.length === 0) {
      chartArea.innerHTML = '<div style="font-size:13px;color:#9A9689;">변화량 데이터가 없어요.</div>';
      return;
    }

    const filtered = {};
    for (const s of availableSets) filtered[s.key] = filterChangeByTeam(changes[s.key], mainFilter.team);
    const maxAbs = Math.max(1, ...availableSets.map(s => Math.abs(filtered[s.key].total)));

    chartArea.innerHTML = `<div class="vBarChart">${availableSets.map((s) => {
      const c = filtered[s.key];
      const heightPct = Math.min(100, Math.abs(c.total) / maxAbs * 100);
      const cls = c.total >= 0 ? 'pos' : 'neg';
      return `
        <div class="vBarGroup" data-set="${s.key}">
          <div class="vBarValue">${c.total >= 0 ? '+' : ''}${fmtWon(c.total)}</div>
          <div class="vBarTrack"><div class="vBarFill ${cls}" style="height:${heightPct}%;"></div></div>
          <div class="vBarLabel">${s.label}</div>
        </div>`;
    }).join('')}</div>`;

    chartArea.querySelectorAll('.vBarGroup').forEach((group) => {
      group.addEventListener('click', () => {
        chartArea.querySelectorAll('.vBarGroup').forEach(g => g.classList.remove('active'));
        group.classList.add('active');
        const setKey = group.getAttribute('data-set');
        renderQuarterSummary(setKey, filtered[setKey]);
      });
    });
  }

  const QUARTERS = [
    { label: '1분기', key: 'q1', months: [1, 2, 3] },
    { label: '2분기', key: 'q2', months: [4, 5, 6] },
    { label: '3분기', key: 'q3', months: [7, 8, 9] },
    { label: '4분기', key: 'q4', months: [10, 11, 12] },
  ];

  // 분기 요약 목록 (변화 내용 패널) — 분기를 클릭하면 그 분기 3개월치 개별 항목을 팝업으로 보여준다.
  function renderQuarterSummary(setKey, c) {
    const detailArea = document.getElementById('detailArea');
    const setLabel = SET_META.find(s => s.key === setKey).label;
    function hasAnyDetail(months) { return months.some(m => (c.monthDetails[m - 1] || []).length > 0); }

    // 진짜로 아무 변화도 없는 분기(값도 0이고 세부내역도 없음)는 아예 숨긴다.
    // 상쇄되어 0이 된 분기(0±, 세부내역은 있음)는 그대로 보여준다.
    const visibleQuarters = QUARTERS.filter(q => c[q.key] !== 0 || hasAnyDetail(q.months));

    if (visibleQuarters.length === 0) {
      detailArea.innerHTML = `<div class="empty">${setLabel}에는 분기별로 특별한 변화가 없었어요.</div>`;
      return;
    }

    const maxAbsQ = Math.max(1, ...visibleQuarters.map(q => Math.abs(c[q.key])));
    const barsHtml = visibleQuarters.map((q) => {
      const val = c[q.key];
      const isCancelled = val === 0 && hasAnyDetail(q.months);
      const heightPct = isCancelled ? 6 : Math.max(6, Math.min(100, Math.abs(val) / maxAbsQ * 100));
      const cls = isCancelled ? '' : (val >= 0 ? 'pos' : 'neg');
      const valueHtml = isCancelled ? `0<span style="font-size:9px;">±</span>` : `${val >= 0 ? '+' : ''}${fmtWon(val)}`;
      const barBg = isCancelled ? 'background:var(--warn);' : '';
      return `<div class="vBarGroup qSummaryBar" data-quarter="${q.key}" style="flex:1;">
        <div class="vBarValue" style="${isCancelled ? 'color:var(--warn);' : ''}">${valueHtml}</div>
        <div class="vBarTrack" style="height:90px;max-width:44px;">
          <div class="vBarFill ${cls}" style="height:${heightPct}%;${barBg}"></div>
        </div>
        <div class="vBarLabel" style="font-size:12px;">${q.label}</div>
      </div>`;
    }).join('');

    detailArea.innerHTML = `<div class="qSummaryHint">${setLabel} — 분기를 클릭하면 세부 내역이 팝업으로 나와요</div>
      <div class="vBarChart" style="height:150px;gap:10px;">${barsHtml}</div>`;

    detailArea.querySelectorAll('.qSummaryBar').forEach((el) => {
      el.addEventListener('click', () => {
        const qKey = el.getAttribute('data-quarter');
        showQuarterPopup(qKey, setLabel, c);
      });
    });
  }

  function showQuarterPopup(qKey, setLabel, c) {
    const q = QUARTERS.find(qq => qq.key === qKey);
    const items = [];
    for (const m of q.months) {
      const list = c.monthDetails[m - 1] || [];
      for (const item of list) items.push(item);
    }
    items.sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
    showDetailModal(`${q.label} ${setLabel} 변화 내역`, items);
  }

  // ----- 상세 팝업 -----
  const detailModal = document.getElementById('detailModal');
  const detailModalBackdrop = document.getElementById('detailModalBackdrop');
  const detailModalTitle = document.getElementById('detailModalTitle');
  const detailModalBody = document.getElementById('detailModalBody');
  const detailModalClose = document.getElementById('detailModalClose');

  function showDetailModal(title, items) {
    detailModalTitle.textContent = title;
    if (!items || items.length === 0) {
      detailModalBody.innerHTML = '<div style="font-size:13px;color:var(--ink-40);">이 분기에는 변화가 없었어요.</div>';
    } else {
      detailModalBody.innerHTML = items.map((it) => {
        const cls = it.delta > 0 ? 'pos' : 'neg';
        const sign = it.delta > 0 ? '+' : '';
        return `<div class="modalItem"><span>${it.name}</span><span class="amt ${cls}">${sign}${fmtWon(it.delta)}</span></div>`;
      }).join('');
    }
    detailModal.style.display = 'block';
    detailModalBackdrop.style.display = 'block';
  }

  function hideDetailModal() {
    detailModal.style.display = 'none';
    detailModalBackdrop.style.display = 'none';
  }

  detailModalClose.addEventListener('click', hideDetailModal);
  detailModalBackdrop.addEventListener('click', hideDetailModal);

  // ----- TOP10 기능: 시작월/종료월 선택 -> 팀별 매출/수주 상위 10개 프로젝트 -----
  function renderTop10Feature() {
    const container = document.getElementById('featureContent');
    const projects = DATA && DATA.projects;
    if (!projects || (!projects.revenue.length && !projects.order.length)) {
      container.innerHTML = '<div class="card"><div style="font-size:13px;color:#9A9689;">TOP10을 계산할 프로젝트 데이터가 없어요.</div></div>';
      return;
    }
    container.innerHTML = `
      <div class="card">
        <div class="card-title">구간별 실적조회</div>
        <div class="range-inputs" style="margin-bottom:14px;">
          <label style="font-size:12px;color:#5B5F6B;margin-right:6px;">시작월</label>
          <input type="number" id="top10Start" min="1" max="12" value="1" />
          <label style="font-size:12px;color:#5B5F6B;margin:0 6px 0 14px;">종료월</label>
          <input type="number" id="top10End" min="1" max="12" value="12" />
        </div>
        <table class="dataTable" id="targetTable"></table>
      </div>
      <div class="card">
        <div class="card-title">TOP 10</div>
        <div id="top10Body"></div>
      </div>
    `;
    function refreshTop10Page() { renderTargetTable(); renderTop10Body(); }
    document.getElementById('top10Start').addEventListener('input', refreshTop10Page);
    document.getElementById('top10End').addEventListener('input', refreshTop10Page);
    refreshTop10Page();
  }

  function rankTop10(records, team, start, end) {
    const rows = records
      .filter(r => r.team === team)
      .map(r => ({ name: r.name, sum: sumRange(r.monthAmt, start, end) }))
      .filter(r => r.sum !== 0)
      .sort((a, b) => b.sum - a.sum)
      .slice(0, 10);
    return rows;
  }

  function top10TableHtml(title, rows) {
    if (rows.length === 0) return `<div style="font-size:12px;color:#9A9689;margin-bottom:16px;">${title}: 해당 구간에 데이터가 없어요.</div>`;
    return `<div style="margin-bottom:16px;">
      <div style="font-size:12px;font-weight:600;color:#3A3D45;margin-bottom:6px;">${title}</div>
      <table class="dataTable"><tr><th style="width:30px;">#</th><th>프로젝트</th><th>금액</th></tr>
      ${rows.map((r, i) => `<tr><td>${i + 1}</td><td style="text-align:left;">${r.name}</td><td>${fmtWon(r.sum)}</td></tr>`).join('')}
      </table>
    </div>`;
  }

  function renderTop10Body() {
    const start = Math.max(1, Math.min(12, Number(document.getElementById('top10Start').value) || 1));
    const end = Math.max(1, Math.min(12, Number(document.getElementById('top10End').value) || 12));
    const projects = DATA.projects;
    const teamSet = new Set();
    projects.revenue.forEach(r => teamSet.add(r.team));
    projects.order.forEach(r => teamSet.add(r.team));
    const teams = Array.from(teamSet).sort();

    let html = '';
    for (const team of teams) {
      const revRows = rankTop10(projects.revenue, team, start, end);
      const ordRows = rankTop10(projects.order, team, start, end);
      html += `<div style="margin-bottom:24px;">
        <div style="font-size:14px;font-weight:700;color:#1A1D24;margin-bottom:10px;">${team}</div>
        <div class="top10SplitRow" style="display:flex;gap:20px;align-items:flex-start;">
          <div style="flex:1 1 0;min-width:0;">${top10TableHtml('수주 TOP10', ordRows)}</div>
          <div style="flex:1 1 0;min-width:0;">${top10TableHtml('매출 TOP10', revRows)}</div>
        </div>
      </div>`;
    }
    document.getElementById('top10Body').innerHTML = html || '<div style="font-size:13px;color:#9A9689;">표시할 팀이 없어요.</div>';
  }

  // ----- 매출일정 기능: 전사 모든 프로젝트를 팀별로 묶어서 1~12월 금액을 표로 -----
  function hqOfTeam(team) {
    const idx = team.indexOf('본부');
    return idx === -1 ? team : team.slice(0, idx + 2);
  }

  function fmtThousand(n) {
    if (!n) return '';
    return Math.round(n / 1000).toLocaleString('en-US');
  }

  let scheduleViewMode = {}; // hq -> '통합' | '팀별'

  function renderScheduleFeature() {
    const container = document.getElementById('featureContent');
    const projects = DATA && DATA.projects;
    const maSchedule = (DATA && DATA.maSchedule) || { revenue: [], order: [] };
    if (!projects || !projects.revenue.length) {
      container.innerHTML = '<div class="card"><div style="font-size:13px;color:#9A9689;">매출일정 데이터가 없어요.</div></div>';
      return;
    }
    const teamSet = new Set();
    projects.revenue.forEach(r => teamSet.add(r.team));
    maSchedule.revenue.forEach(r => teamSet.add(r.team));
    const teams = Array.from(teamSet).sort();

    const hqMap = new Map(); // hq -> [teams...]
    for (const team of teams) {
      const hq = hqOfTeam(team);
      if (!hqMap.has(hq)) hqMap.set(hq, []);
      hqMap.get(hq).push(team);
    }

    container.innerHTML = Array.from(hqMap.keys()).sort().map(hq => `<div class="card" id="hqCard-${cssSafe(hq)}"></div>`).join('');
    for (const hq of hqMap.keys()) renderHqScheduleCard(hq, hqMap.get(hq), projects, maSchedule);
  }

  function cssSafe(s) { return s.replace(/[^a-zA-Z0-9가-힣]/g, '_'); }

  function sumArr(arr) { return arr.reduce((s, v) => s + v, 0); }
  function sumRange0(arr, startIdx, endIdxExclusive) {
    let s = 0;
    for (let i = startIdx; i < endIdxExclusive; i++) s += arr[i];
    return s;
  }

  const monthHeaderCells = Array.from({ length: 12 }, (_, i) => `<th>${i + 1}월</th>`).join('');

  function sectionRowsHtml(rows) {
    // 계약기간(시작일) 순으로 정렬한다 — 이미 계약된 것은 위로, 계약일이 아직 없는 것은
    // 맨 아래로 가도록 (sortKey가 없으면 999999로 취급해 맨 뒤로 보낸다).
    const keyOf = (r) => (typeof r.sortKey === 'number' ? r.sortKey : 999999);
    const sorted = rows.slice().sort((a, b) => keyOf(a) - keyOf(b));
    return sorted.map((r) => {
      const total = sumArr(r.monthAmt);
      const periodNote = r.period ? ` <span style="font-size:10.5px;color:#9A9689;">(${r.period})</span>` : '';
      return `<tr><td style="text-align:left;">${r.name}${periodNote}</td>${r.monthAmt.map(v => `<td>${v ? fmtThousand(v) : '<span style="color:#D8D3C7;">–</span>'}</td>`).join('')}<td style="font-weight:600;">${fmtThousand(total)}</td></tr>`;
    }).join('');
  }

  function subtotalRowHtml(label, monthsArr, bg) {
    const total = sumArr(monthsArr);
    return `<tr style="background:${bg};"><td style="text-align:left;font-weight:600;">${label}</td>${monthsArr.map(v => `<td>${v ? fmtThousand(v) : '<span style="color:#D8D3C7;">–</span>'}</td>`).join('')}<td style="font-weight:700;">${fmtThousand(total)}</td></tr>`;
  }

  function monthsOf(rows) {
    const m = new Array(12).fill(0);
    for (const r of rows) for (let i = 0; i < 12; i++) m[i] += r.monthAmt[i];
    return m;
  }

  // 프로젝트(솔루션, 기계약/신규로 구분) + MA(통합 1줄)을 받아
  // "1.기계약 2.신규 3.MA" 3구간 + 합계 + 분기별 누적을 그린다.
  function scheduleTableAndCumHtml(solutionRows, maRows) {
    const existingRows = solutionRows.filter(r => r.section === '기계약');
    const newRows = solutionRows.filter(r => r.section === '신규');
    const maTotal = new Array(12).fill(0);
    for (const maRow of maRows) for (let m = 0; m < 12; m++) maTotal[m] += maRow.monthAmt[m];
    const hasMA = sumArr(maTotal) !== 0;
    if (existingRows.length === 0 && newRows.length === 0 && !hasMA) {
      return '<div style="font-size:12px;color:#9A9689;margin-bottom:12px;">데이터가 없어요.</div>';
    }

    let rowsHtml = '';
    if (existingRows.length > 0) {
      rowsHtml += `<tr><td colspan="14" style="text-align:left;font-size:11px;color:#8A8F98;font-weight:600;padding-top:10px;">1. 기계약 프로젝트 (Backlog)</td></tr>`;
      rowsHtml += sectionRowsHtml(existingRows);
      rowsHtml += subtotalRowHtml('기계약 소계', monthsOf(existingRows), '#F2F2F2');
    }
    if (newRows.length > 0) {
      rowsHtml += `<tr><td colspan="14" style="text-align:left;font-size:11px;color:#8A8F98;font-weight:600;padding-top:10px;">2. 신규 프로젝트</td></tr>`;
      rowsHtml += sectionRowsHtml(newRows);
      rowsHtml += subtotalRowHtml('신규 소계', monthsOf(newRows), '#F2F2F2');
    }
    if (hasMA) {
      rowsHtml += `<tr><td colspan="14" style="text-align:left;font-size:11px;color:#8A8F98;font-weight:600;padding-top:10px;">3. MA</td></tr>`;
      rowsHtml += subtotalRowHtml('MA (통합)', maTotal, '#EFEAF6');
    }

    const grandTotalMonths = new Array(12).fill(0);
    for (let m = 0; m < 12; m++) grandTotalMonths[m] = monthsOf(existingRows)[m] + monthsOf(newRows)[m] + (hasMA ? maTotal[m] : 0);
    const grandTotal = sumArr(grandTotalMonths);
    rowsHtml += `<tr class="totalRow"><td style="text-align:left;">(기계약+신규+MA) 합계</td>${grandTotalMonths.map(v => `<td>${v ? fmtThousand(v) : ''}</td>`).join('')}<td>${fmtThousand(grandTotal)}</td></tr>`;

    const cum = [3, 6, 9, 12].map((endMonth, i) => {
      const label = i === 0 ? '1분기' : `1~${i + 1}분기 누적`;
      const val = sumRange0(grandTotalMonths, 0, endMonth);
      return { label, val };
    });
    const cumHtml = `<div style="display:flex;gap:14px;margin:10px 0 4px;">
      ${cum.map(c => `<div style="flex:1;background:#FAFAF7;border:1px solid #E4E0D5;border-radius:8px;padding:10px 12px;">
        <div style="font-size:11px;color:#8A8F98;margin-bottom:4px;">${c.label}</div>
        <div style="font-size:14px;font-weight:700;color:#1A1D24;">${fmtThousand(c.val)}</div>
      </div>`).join('')}
    </div>`;

    return `
      <table class="dataTable" style="width:100%;table-layout:fixed;font-size:12px;">
        <colgroup><col style="width:22%;">${'<col>'.repeat(12)}<col style="width:8%;"></colgroup>
        <tr><th style="text-align:left;">프로젝트</th>${monthHeaderCells}<th>합계</th></tr>
        ${rowsHtml}
      </table>
      ${cumHtml}
    `;
  }

  function renderHqScheduleCard(hq, teamsInHq, projects, maSchedule) {
    const card = document.getElementById(`hqCard-${cssSafe(hq)}`);
    const scope = scheduleViewMode[hq] || '통합'; // '통합' 또는 특정 팀 이름
    const showButtons = teamsInHq.length > 1;

    let buttonsHtml = '';
    if (showButtons) {
      const options = ['통합', ...teamsInHq];
      buttonsHtml = `<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;">
        ${options.map((opt) => {
          const isActive = scope === opt;
          const label = opt === '통합' ? '본부 통합' : opt.replace(hq, '').trim();
          return `<button class="scheduleToggleBtn" data-hq="${cssSafe(hq)}" data-scope="${opt}" style="font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid ${isActive ? '#3A3D45' : '#D8D3C7'};background:${isActive ? '#3A3D45' : '#fff'};color:${isActive ? '#fff' : '#5B5F6B'};cursor:pointer;">${label}</button>`;
        }).join('')}
      </div>`;
    }

    const unitNote = '<div style="font-size:11px;color:#9A9689;margin-bottom:10px;">단위: 천원</div>';
    let solutionRows, maRows, scopeLabel;
    if (scope === '통합' || !showButtons) {
      solutionRows = projects.revenue.filter(r => teamsInHq.includes(r.team));
      maRows = maSchedule.revenue.filter(r => teamsInHq.includes(r.team));
      scopeLabel = hq;
    } else {
      solutionRows = projects.revenue.filter(r => r.team === scope);
      maRows = maSchedule.revenue.filter(r => r.team === scope);
      scopeLabel = scope;
    }
    const bodyHtml = unitNote + scheduleTableAndCumHtml(solutionRows, maRows);

    card.innerHTML = `<div class="card-title">${scopeLabel} — 매출일정</div>${buttonsHtml}<div id="scheduleBody-${cssSafe(hq)}">${bodyHtml}</div>`;

    card.querySelectorAll('.scheduleToggleBtn').forEach((btn) => {
      btn.addEventListener('click', () => {
        scheduleViewMode[hq] = btn.getAttribute('data-scope');
        renderHqScheduleCard(hq, teamsInHq, projects, maSchedule);
      });
    });
  }

  // ----- 초기화: results.json 로드 -----
  async function init() {
    renderNav();
    try {
      const res = await fetch('./data/results.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('results.json을 찾을 수 없어요');
      DATA = await res.json();
    } catch (e) {
      DATA = null;
      document.getElementById('featureContent').innerHTML = `<div class="card"><div style="font-size:13px;color:#A32D2D;">결과 데이터를 불러오지 못했어요.<br><span style="font-size:12px;color:#5B5F6B;">${e.message} — data/results.json이 이 페이지와 같은 저장소의 data 폴더 안에 있는지 확인해주세요.</span></div></div>`;
      renderFeature('main');
      return;
    }
    renderFeature('main');
  }

  init();
})();
</script>

</body>
</html>
